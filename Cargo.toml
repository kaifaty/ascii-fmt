[package]
name = "ascii-fmt"
version = "0.1.2"
edition = "2021"
description = "CLI tool to fix and align ASCII diagrams generated by AI agents"
license = "MIT"
repository = "https://github.com/kaifaty/ascii-fmt"
readme = "README.md"
keywords = ["ascii", "diagram", "formatter", "cli", "box-drawing"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    ".opencode/**",
    "bin/**",
    "dist/**",
    "build/**",
    "node_modules/**",
    "package.json",
    "package-lock.json",
    "test.md",
    "src/*.bak",
    "src/*.backup",
    "src/*temp*.rs",
]

[[bin]]
name = "ascii-fmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
unicode-display-width = "0.3"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
