[package]
name = "ascii-fmt"
version = "0.1.0"
edition = "2021"
description = "CLI tool to fix and align ASCII diagrams generated by AI agents"
license = "MIT"
repository = "https://github.com/yourusername/ascii-fmt"
readme = "README.md"
keywords = ["ascii", "diagram", "formatter", "cli", "box-drawing"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "ascii-fmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
unicode-width = "0.2"
textwrap = "0.16"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "formatter_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
