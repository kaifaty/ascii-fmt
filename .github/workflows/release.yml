name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest

          # Linux (via cross)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use-cross: true

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BINARY="target/${{ matrix.target }}/release/ascii-fmt.exe"
          else
            BINARY="target/${{ matrix.target }}/release/ascii-fmt"
          fi

          if [ ! -f "$BINARY" ]; then
            echo "Error: Binary not found at $BINARY"
            exit 1
          fi

          # Determine archive extension based on OS
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            ARCHIVE="ascii-fmt-${{ matrix.target }}.zip"
            if command -v powershell &> /dev/null; then
              powershell -command "Compress-Archive -Path $BINARY -DestinationPath dist/$ARCHIVE"
            else
              zip -j "dist/$ARCHIVE" "$BINARY"
            fi
          elif [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
            ARCHIVE="ascii-fmt-${{ matrix.target }}.tar.gz"
            tar -czf "dist/$ARCHIVE" -C "$(dirname $BINARY)" "$(basename $BINARY)"
          else
            ARCHIVE="ascii-fmt-${{ matrix.target }}.tar.gz"
            tar -czf "dist/$ARCHIVE" -C "$(dirname $BINARY)" "$(basename $BINARY)"
          fi

          echo "Created archive: $ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascii-fmt-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
